<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>🎯 Quiz Master</h1>
      <p>¡Pon a prueba tus conocimientos!</p>
    </header>

    <section id="home-screen" class="screen active">
      <h2>Elige tu quiz</h2>
      <p class="intro">Selecciona una categoría. Cada partida tiene 10 preguntas aleatorias.</p>
      <div id="quiz-list" class="quiz-list">
        <p>Cargando cuestionarios...</p>
      </div>
      <button id="ranking-button" class="secondary">Ver ranking</button>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="quiz-top">
        <span id="quiz-category"></span>
        <span id="question-count"></span>
        <span id="score">Puntos: 0</span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <h2 id="question-text"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div class="quiz-actions">
        <button id="hint-button" class="secondary">💡 Ver pista</button>
        <button id="confirm-button" disabled>Confirmar respuesta</button>
      </div>
    </section>

    <section id="results-screen" class="screen">
      <h2>¡Quiz terminado!</h2>
      <p id="final-score" class="final-score"></p>
      <label for="player-name">Tu nombre para el ranking:</label>
      <input id="player-name" type="text" maxlength="20" placeholder="Escribe tu nombre">
      <button id="save-score-button">Guardar puntuación</button>
      <button id="menu-button" class="secondary">Volver al menú</button>
      <p id="save-message" class="feedback"></p>
    </section>

    <section id="ranking-screen" class="screen">
      <h2>🏆 Ranking</h2>
      <ol id="ranking-list" class="ranking-list"></ol>
      <button id="back-button" class="secondary">Volver</button>
    </section>
    <footer>Quiz Master · Proyecto de clase</footer>
  </main>
</body>
</html>
